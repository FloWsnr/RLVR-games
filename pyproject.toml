[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlvr-physics"
version = "0.1.0"
description = "Trainer-agnostic executable verifier tasks for RLVR"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["rlvr_physics"]

[tool.pytest.ini_options]
addopts = "--capture=sys"
pythonpath = ["."]
testpaths = ["tests"]
